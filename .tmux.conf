# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'light'

set -g mouse on

# Force zsh for new windows even when the inherited $SHELL is stale
if-shell '[ "$(uname -s)" = "Linux" ]' 'set -g default-shell /usr/bin/zsh'
if-shell '[ "$(uname -s)" = "Darwin" ]' 'set -g default-shell /bin/zsh'

# key binding
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc"
set -g allow-passthrough on
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g status-style bg=default

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# set border color
set -g pane-border-style fg=white
set -g pane-active-border-style fg=white
